name: Publish npm

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  makeworlds:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Is this version on npm?
        id: release
        working-directory: packages/makeworlds
        run: |
          version=$(jq -r .version package.json)
          if ! npm view "makeworlds@$version" version > /dev/null 2>&1; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm pack "makeworlds@$version" --pack-destination "$RUNNER_TEMP" --silent > /dev/null
          tar -xzf "$RUNNER_TEMP/makeworlds-$version.tgz" -C "$RUNNER_TEMP" package/openapi.json
          if ! cmp -s openapi.json "$RUNNER_TEMP/package/openapi.json"; then
            echo "::warning file=packages/makeworlds/package.json::The API changed since makeworlds@$version. Bump the version to publish it."
          fi
      - if: steps.release.outputs.version
        run: pnpm --filter makeworlds publish --access public --no-git-checks
      - if: steps.release.outputs.version
        name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          previous=$(git tag --list 'makeworlds@*' --sort=-v:refname | head -1)
          git log --format='- %s (%h)' ${previous:+$previous..}HEAD -- packages/makeworlds apps/api/src > "$RUNNER_TEMP/notes.md"
          gh release create "makeworlds@$VERSION" --target "$SHA" --title "makeworlds $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
